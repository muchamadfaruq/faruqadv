<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Guru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --violet-dark: #4b1c71;
            --violet-main: #6a1fb0;
            --violet-light: #b48cff;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, var(--violet-light), var(--violet-main), var(--violet-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .profile-card {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            display: grid;
            grid-template-columns: 300px 1fr;
            overflow: hidden;
        }

        .profile-photo {
            background: linear-gradient(160deg, var(--violet-main), var(--violet-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .photo-wrapper {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-content {
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .profile-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .profile-header p {
            margin-top: 8px;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .info-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 18px 20px;
        }

        .info-item span {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }

        .info-item strong {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .footer-note {
            margin-top: auto;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        @media (max-width: 768px) {
            .profile-card {
                grid-template-columns: 1fr;
            }

            .profile-photo {
                padding: 32px;
            }

            .profile-content {
                padding: 32px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <div class="profile-photo">
            <div class="photo-wrapper">
                <!-- Ganti src dengan foto Anda -->
                <img src="https://faruq.dwisma.id/img/profile.jpeg" alt="Foto Profil Muchamad Faruq">
            </div>
        </div>

        <div class="profile-content">
            <div class="profile-header">
                <h1>Muchamad Faruq</h1>
                <p>Guru Sosiologi • SMA Negeri 2 Mengwi</p>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span>Tempat, Tanggal Lahir</span>
                    <strong>Jakarta, 26 Maret 1996</strong>
                </div>
                <div class="info-item">
                    <span>Jenis Kelamin</span>
                    <strong>Laki-laki</strong>
                </div>
                <div class="info-item">
                    <span>Mata Pelajaran</span>
                    <strong>Sosiologi</strong>
                </div>
                <div class="info-item">
                    <span>Institusi</span>
                    <strong>SMA Negeri 2 Mengwi</strong>
                </div>
            </div>

            <div class="footer-note">
                Profil profesional pendidik dengan fokus pada pengembangan pemikiran kritis dan kesadaran sosial.
            </div>
        </div>
    </div>
</body>

</html>
